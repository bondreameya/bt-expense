<style>
  :root {
    --teal: #0f766e; --teal-dark: #115e59; --teal-light: #ccfbf1; --teal-50: #f0fdfa;
    --text: #1f2937; --muted: #6b7280; --border: #d1e7e4; --danger: #b91c1c; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: var(--teal-50); }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px;
            background: var(--teal); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .brand { font-weight: 600; font-size: 18px; letter-spacing: .3px; }
  .userbox { display: flex; gap: 12px; align-items: center; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
          box-shadow: 0 1px 3px rgba(15,118,110,.08); margin-bottom: 16px; }
  .narrow { max-width: 400px; margin: 40px auto; }
  h2 { margin-top: 0; color: var(--teal-dark); }
  label { display: block; font-size: 14px; margin-bottom: 14px; color: var(--muted); }
  label.inline { display: inline-flex; gap: 8px; align-items: center; margin: 0; }
  input, select { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 15px;
                  border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  label.inline select { width: auto; margin-top: 0; }
  input:focus, select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-light); }
  .btn { border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .btn-primary { background: var(--teal); color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-primary:disabled { opacity: .6; cursor: wait; }
  .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); padding: 6px 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .stat-label { color: var(--muted); font-size: 13px; }
  .stat-value { font-size: 26px; font-weight: 600; color: var(--teal-dark); margin-top: 6px; }
  .badge { background: var(--teal-light); color: var(--teal-dark); padding: 4px 10px; border-radius: 999px; font-size: 13px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .hidden { display: none !important; }
  .toast { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; background: #fee2e2; color: var(--danger); }
  .toast.ok { background: var(--teal-light); color: var(--teal-dark); }
  .loading { position: fixed; inset: 0; background: rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--teal-light); border-top-color: var(--teal); border-radius: 50%;
             animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav a { color: #e6fffa; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .nav a:hover, .nav a.active { background: rgba(255,255,255,.15); color: #fff; }
  .pill { background: #f59e0b; color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  main { max-width: 1250px; }
  h3 { margin: 0 0 12px; color: var(--teal-dark); font-size: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  label.inline input { width: auto; margin-top: 0; }
  .btn { background: #fff; color: var(--teal-dark); border: 1px solid var(--border); }
  .btn:hover { background: var(--teal-50); }
  .btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); width: auto; }
  .btn-block { width: 100%; }
  .btn-danger { background: #fff; color: var(--danger); border-color: #fecaca; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .filters label { margin: 0; min-width: 150px; flex: 1; }
  .table-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--border); padding: 10px 8px; white-space: nowrap; }
  .tbl td { border-bottom: 1px solid #eef5f4; padding: 12px 8px; vertical-align: top; }
  .tbl tr.clickable { cursor: pointer; } .tbl tr.clickable:hover td, .tbl tr.selected td { background: var(--teal-50); }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pager { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 12px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #eef2f2; color: var(--muted); }
  .tag.ok { background: var(--teal-light); color: var(--teal-dark); } .tag.warn { background: #fef3c7; color: #92400e; } .tag.bad { background: #fee2e2; color: var(--danger); }
  .split { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; } @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs a { padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--teal-dark); background: #fff; border: 1px solid var(--border); }
  .tabs a.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10; }
  .modal-box { width: 100%; max-width: 620px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; } .form-grid .full { grid-column: 1 / -1; }
  textarea { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font: inherit; border: 1px solid var(--border); border-radius: 8px; min-height: 70px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  .diff td.changed { background: #fef3c7; } .diff td.new { background: var(--teal-light); }
  .hint { background: #fef3c7; color: #92400e; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  .checks label { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--text); }
  .checks input { width: auto; margin: 0; }
  .toast { position: sticky; top: 8px; z-index: 20; }
  .btn-spin { display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px; border: 2px solid currentColor;
              border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  .is-busy { cursor: progress !important; opacity: .75; } a.is-busy { pointer-events: none; }
  .btn:disabled { cursor: not-allowed; }
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; overflow: hidden; background: var(--teal-light); }
  .progress div { position: absolute; height: 100%; width: 35%; background: #14b8a6; animation: prog 1.1s ease-in-out infinite; }
  @keyframes prog { 0% { left: -35%; } 100% { left: 100%; } }
  .loading { background: rgba(255,255,255,.35); }
  .cat-group { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .cat-parent { display: flex; gap: 8px; align-items: center; font-weight: 600; color: var(--teal-dark); margin: 0 0 6px; }
  .cat-parent input, .cat-child input { width: auto; margin: 0; accent-color: var(--teal); }
  .cat-children { padding-left: 24px; }
</style>
